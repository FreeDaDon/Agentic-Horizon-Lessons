# AI Developer Workflow (ADW) Implementation Expertise
# Autonomous Multi-Step Workflows with Real-Time Visualization

overview:
  description: "Fire-and-forget autonomous agent workflows that combine deterministic orchestration with non-deterministic AI execution"
  core_insight: "The highest leverage point of agentic coding - deterministic Python code orchestrates non-deterministic Claude agents, outperforming both raw agents and raw code alone"
  architecture_pattern: "Background process spawning with WebSocket real-time updates and swimlane visualization"
  value_proposition:
    - "Background execution: Workflows run as detached processes in their own process group (cancellable)"
    - "Multi-step orchestration: Chain specialized prompts (plan -> build -> review <-> fix)"
    - "Bounded: every step has max_turns, max_budget_usd and a wall clock cap; each ADW has a total budget"
    - "Typed hand-offs: agents report plan paths and review verdicts through in-process submit tools"
    - "Full observability: Every tool call, response, thinking block logged"
    - "AI-powered summaries: Claude Haiku generates summaries for every event (bounded, toolless)"

workflow_types:
  # Discovered by adw_scripts.discover_workflows(): adw_workflows/adw_<type>.py with a literal TOTAL_STEPS
  plan_build:
    steps: 2
    file: "adws/adw_workflows/adw_plan_build.py"
    STEPS: "[plan, build]"
    use_case: "Quick features - plan the implementation, then build it"

  plan_build_review:
    steps: 3
    file: "adws/adw_workflows/adw_plan_build_review.py"
    STEPS: "[plan, build, review_must_pass]"
    use_case: "Quality gate - status 'failed' (error_step 'review') unless the review passes"

  plan_build_review_fix:
    steps: 4
    file: "adws/adw_workflows/adw_plan_build_review_fix.py"
    STEPS: "[plan, build, review_until_pass]"
    use_case: "Full automation - review, then fix + re-review up to input_data.max_fix_rounds (default 2)"
    escalation: "Still failing after N rounds -> failed, error_message 'escalate: review still failing after N fix rounds'"

composability:
  principle: "Each step is deterministic in structure, non-deterministic in execution"
  steps:
    plan:
      permission_mode: "acceptEdits"
      hand_off: "Agent calls mcp__adw__submit_plan(plan_path); validated by adw_plan.existing_plan_path"
      failure: "No valid submit_plan call -> plan step fails (no newest-file or extraction-prompt fallback)"
      slash_command: "/plan '<prompt>'"
    build:
      permission_mode: "acceptEdits"
      slash_command: "/build '<plan_path>'"
    review:
      permission_mode: "dontAsk (read-only)"
      tools: "Read, Glob, Grep, Bash(git diff|status|log|show:*), mcp__adw__submit_review; Write/Edit/MultiEdit/NotebookEdit disallowed"
      hand_off: "Agent calls mcp__adw__submit_review(verdict PASS|FAIL, report, blocker_count); Python writes app_review/review_<adw8>_r<round>.md"
      fail_closed: "No valid submit_review call -> verdict parsed from text (adw_review.parse_verdict) for the record only; never passes"
      slash_command: "/review '<prompt>' '<plan_path>'"
    fix:
      permission_mode: "acceptEdits"
      slash_command: "/fix '<prompt>' '<plan_path>' '<review_path>'"
  argument_quoting: "adw_steps.slash_command() shell-quotes each argument (shlex.quote); Claude Code splits them into $1, $2, ..."

  create_custom_workflow: |
    1. Copy a workflow file (e.g., adw_plan_build.py) to adw_workflows/adw_<type>.py
    2. Set STEPS to a list of step functions from adw_modules/adw_steps.py (or new ones)
    3. Set TOTAL_STEPS to a literal int (discovery reads it with ast; no registration needed)
    4. New step kinds: add a StepName, a STEP_PROFILES entry and a DEFAULT_CAPS entry in adw_steps.py
    5. Create the matching slash command in .claude/commands/

caps_and_budget:
  defaults: "plan 40 turns/$3/30m, build 80/$8/60m, review 40/$3/30m, fix 60/$5/45m (DEFAULT_CAPS)"
  overrides: "input_data.step_caps.<step>.{max_turns,max_budget_usd,timeout_seconds}"
  sdk: "max_turns and max_budget_usd go to ClaudeAgentOptions; error_max_turns / error_max_budget_usd results fail the step"
  wall_clock: "asyncio.timeout(timeout_seconds) around each query"
  adw_budget: "input_data.max_budget_usd (default 20): before each step, spent + step cap must fit or the ADW fails ('budget: ...')"

core_implementation:
  adw_modules:
    adw_steps:
      file: "adws/adw_modules/adw_steps.py"
      purpose: "Shared step runner; workflow files are just STEPS lists handed to run_cli"
      key_types:
        AdwInput: "Parsed input_data: prompt, working_dir, model, review_model, fix_model, max_budget_usd, max_fix_rounds, step_caps"
        StepSpec: "name, label (e.g. review-r1), prompt, model, StepProfile, StepCaps"
        AdwRun: "One execution: input, sink, execute (swappable), output, done steps; step() enforces the budget"
        AdwOutput: "output_data: plan_path, reviews[], steps[], total_cost_usd"
        ReviewOutcome: "verdict, verdict_source (submit_review|final_message), report_path; passed only via submit_review"
      key_functions:
        plan / build / review_must_pass / review_until_pass: "Workflow building blocks"
        execute_step: "Agent row lifecycle, logging hooks, handlers, submit server, caps"
        submit_server: "In-process SDK MCP server 'adw' with submit_plan or submit_review"
        run_workflow: "Any exception (even before step 1) -> row status 'failed'; drains summaries before closing"
        DbSink: "Production sink over adw_database/adw_logging; logging failures inside steps are logged and ignored"
        SummaryPool: "Background summaries: Semaphore(4), task references kept, drain() awaits/cancels"

    adw_agent_sdk:
      file: "adws/adw_modules/adw_agent_sdk.py"
      purpose: "Typed Pydantic wrapper for Claude Agent SDK"
      key_classes:
        QueryOptions: "Every field maps to a ClaudeAgentOptions field: model, resume, fork_session, cwd, permission_mode, tools, allowed_tools, disallowed_tools, hooks, mcp_servers, setting_sources, max_turns, max_budget_usd, system_prompt"
        QueryOutput: "success, result, error, result_subtype, num_turns, total_cost_usd, usage, usage_accumulator (deduped by message_id)"
        HooksConfig: "Hook configuration for agent events"
      key_functions:
        build_sdk_options: "QueryOptions -> ClaudeAgentOptions (tested field-by-field)"
        query_to_completion: "Full agent run; client_factory lets offline tests replay recorded streams"
        quick_prompt: "Fast single-shot query without hooks"

    adw_plan:
      file: "adws/adw_modules/adw_plan.py"
      key_function: "existing_plan_path(candidate, working_dir) -> absolute path or None"
    adw_review:
      file: "adws/adw_modules/adw_review.py"
      key_function: "parse_verdict(text) -> PASS/FAIL/None; fallback record only, FAIL wins"

    adw_logging:
      file: "adws/adw_modules/adw_logging.py"
      purpose: "Step lifecycle logging and event capture"
      key_functions:
        log_step_start: "Mark step beginning, broadcast StepStart event"
        log_step_end: "Mark step completion, broadcast StepEnd event"
        log_adw_event: "Log individual agent events (tool, thinking, response)"
      database_table: "agent_logs"

    adw_websockets:
      file: "adws/adw_modules/adw_websockets.py"
      purpose: "Real-time WebSocket broadcasting from ADW processes (websockets.asyncio.client)"
      key_functions:
        broadcast_adw_event: "Send event to all connected frontends"
        broadcast_adw_created: "Notify UI of new ADW"
        broadcast_adw_step_change: "Notify UI of step lifecycle"
        broadcast_adw_event_summary_update: "Send AI-generated summary"
      resilience: "Fails silently if WebSocket server unavailable"

    adw_summarizer:
      file: "adws/adw_modules/adw_summarizer.py"
      purpose: "AI-powered event summaries using Claude Haiku"
      safety: "summary_options(): tools=[], allowed_tools=[], max_turns=1, default permissions"
      output: "1-sentence summaries (50-100 chars)"

    adw_database:
      file: "adws/adw_modules/adw_database.py"
      purpose: "Database operations for ADW processes"
      key_functions:
        get_adw: "Fetch ADW record by ID"
        update_adw_status: "Update ADW status and progress"
        merge_adw_output: "JSONB-merge into output_data"
        create_agent: "Create agent record for workflow step"

  adw_triggers:
    adw_scripts:
      file: "adws/adw_triggers/adw_scripts.py"
      purpose: "Stdlib-only runner shared by the backend and the manual trigger"
      adws_dir: "Resolved from the file's own location (ADWS_DIR), never from a caller's working dir"
      key_functions:
        discover_workflows: "type -> WorkflowInfo(path, total_steps, description)"
        start_workflow: "Validate type + UUID, spawn `uv run ... --adw-id` in a new session; returns RunHandle(pid, log_path)"
        cancel_adw: "Read pid from row metadata, SIGTERM then SIGKILL the process group, mark 'cancelled'"
      logs: "stdout+stderr appended to agents/adw/<adw_id>/run.log; pid + log_path stored in row metadata"

    adw_manual_trigger:
      file: "adws/adw_triggers/adw_manual_trigger.py"
      purpose: "CLI trigger for testing workflows; validates type before inserting the row"
      usage: "uv run adws/adw_triggers/adw_manual_trigger.py <name> <type> <prompt> <working_dir> [model] [--review-model M] [--fix-model M] [--max-budget-usd N] [--max-fix-rounds N]"

orchestrator_integration:
  adw_bridge:
    file: "apps/orchestrator_3_stream/backend/modules/adw_bridge.py"
    purpose: "Backend's only import path to adw_scripts (discovery, start, record_run, cancel)"

  start_adw_tool:
    file: "apps/orchestrator_3_stream/backend/modules/agent_manager.py"
    signature: "start_adw(name_of_adw, workflow_type, prompt, description?, model?, review_model?, fix_model?, max_budget_usd?, max_fix_rounds?)"
    flow:
      - "Validate workflow_type with adw_bridge.require_workflow (same discovery as the runner)"
      - "create_adw() with total_steps from TOTAL_STEPS and options merged into input_data"
      - "Broadcast adw_started, start_workflow(), record_run() stores pid + log_path"

  check_adw_tool:
    file: "apps/orchestrator_3_stream/backend/modules/agent_manager.py"
    signature: "check_adw(adw_id: str, tail_count?: int, event_type?: str, include_step_details?: bool)"
    purpose: "Check ADW status and recent activity"

  cancel_adw:
    tool: "cancel_adw(adw_id) in agent_manager.py, registered as mcp__mgmt__cancel_adw"
    endpoint: "POST /adws/{adw_id}/cancel in main.py (404 unknown, 409 already finished)"

  database_functions:
    file: "apps/orchestrator_3_stream/backend/modules/database.py"
    functions:
      create_adw: "Create ADW record; input_data = options + prompt + working_dir"
      merge_adw_metadata: "JSONB-merge into metadata (runner pid, log_path)"
      get_adw: "Fetch ADW by ID"
      update_adw_status: "Update status, current_step, completed_steps"
      get_adw_logs: "Fetch agent_logs for ADW swimlane"
      get_adw_system_logs: "Fetch system_logs for ADW"

websocket_events:
  adw_created:
    source: "websocket_manager.py:232-234"
    fields: ["type", "adw"]
    trigger: "When new ADW record created"

  adw_updated:
    source: "websocket_manager.py:236-240"
    fields: ["type", "adw_id", "adw"]
    trigger: "Status change, step progress"

  adw_event:
    source: "websocket_manager.py:242-246"
    fields: ["type", "adw_id", "event"]
    trigger: "Agent event for swimlane square"

  adw_step_change:
    source: "websocket_manager.py:248-261"
    fields: ["type", "adw_id", "step", "event_type", "payload", "timestamp"]
    trigger: "StepStart/StepEnd events"

  adw_event_summary_update:
    source: "websocket_manager.py:263-274"
    fields: ["type", "adw_id", "event_id", "summary"]
    trigger: "AI summary generated for event"

frontend_integration:
  swimlane_component:
    file: "apps/orchestrator_3_stream/frontend/src/components/AdwSwimlanes.vue"
    lines: 1024
    purpose: "Main ADW visualization component"
    features:
      - "ADW list with status (pending/in_progress/completed/failed)"
      - "Step lanes with unique colors per step"
      - "Event squares with icons by type"
      - "Event detail panel with AI summaries"
      - "Filter controls (response, tool, thinking, hook, system)"
      - "Real-time WebSocket updates"

    event_icons:
      TextBlock: "response (green)"
      ToolUseBlock: "tool (orange)"
      ThinkingBlock: "thinking (purple)"
      PreToolUse: "hook (cyan)"
      PostToolUse: "hook (cyan)"
      StepStart: "start (cyan)"
      StepEnd: "end (green)"
      Stop: "stop (red)"

  adw_service:
    file: "apps/orchestrator_3_stream/frontend/src/services/adwService.ts"
    key_functions:
      getAdws: "Fetch all ADWs"
      getAdwEvents: "Fetch events for swimlane (limit: 2000)"
      getAdwSummary: "Fetch ADW with step breakdown"

  store_integration:
    file: "apps/orchestrator_3_stream/frontend/src/stores/orchestratorStore.ts"
    state:
      adws: "ref<AiDeveloperWorkflow[]>"
      adwEvents: "ref<AdwEvent[]>"
      allAdwEventsByStep: "computed - events grouped by ADW and step"
    actions:
      fetchAdws: "Load all ADWs"
      fetchAdwEvents: "Load events for specific ADW"
      fetchAllAdwEvents: "Load events for all ADWs"
    websocket_handlers:
      onAdwCreated: "Add new ADW to list"
      onAdwUpdated: "Update ADW in list"
      onAdwEvent: "Add event to swimlane"
      onAdwEventSummaryUpdate: "Update event summary"

  types:
    file: "apps/orchestrator_3_stream/frontend/src/types.d.ts"
    interfaces:
      AiDeveloperWorkflow:
        lines: "405-426"
        fields: ["id", "orchestrator_agent_id", "adw_name", "workflow_type", "status", "current_step", "total_steps", "completed_steps", "started_at", "completed_at", "duration_seconds", "input_data", "output_data", "error_message"]
      AdwEvent:
        lines: "429-439"
        fields: ["id", "agent_id", "adw_id", "adw_step", "event_category", "event_type", "summary", "payload", "timestamp"]
      AdwStepSummary:
        lines: "442-448"
        fields: ["step", "event_count", "event_types", "agent_id", "started_at", "ended_at"]

slash_commands:
  plan:
    file: ".claude/commands/plan.md"
    purpose: "Create implementation spec"
    output: "specs/<name>.md, then mcp__adw__submit_plan when run by an ADW"

  build:
    file: ".claude/commands/build.md"
    purpose: "Implement from spec"
    input: "Path to spec file"

  review:
    file: ".claude/commands/review.md"
    purpose: "Risk-tiered code review"
    output: "Under an ADW: mcp__adw__submit_review (Python writes the file). Interactive: app_review/review_<timestamp>.md"
    verdict: "PASS or FAIL"

  fix:
    file: ".claude/commands/fix.md"
    purpose: "Fix issues from review"
    input: "User prompt, plan path, review path"
    output: "app_fix_reports/fix_<timestamp>.md"

database_schema:
  ai_developer_workflows:
    table: "ai_developer_workflows"
    key_columns:
      - "id (UUID primary key)"
      - "orchestrator_agent_id (UUID foreign key)"
      - "adw_name (VARCHAR)"
      - "workflow_type (VARCHAR)"
      - "status (VARCHAR: pending/in_progress/completed/failed/cancelled)"
      - "current_step (VARCHAR nullable)"
      - "total_steps (INTEGER)"
      - "completed_steps (INTEGER default 0)"
      - "input_data (JSONB - prompt, working_dir, models, max_budget_usd, max_fix_rounds, step_caps)"
      - "output_data (JSONB - plan_path, reviews, steps, total_cost_usd)"
      - "metadata (JSONB - runner pid, log_path)"
      - "error_message (TEXT nullable)"
      - "started_at, completed_at, duration_seconds"

  agent_logs:
    table: "agent_logs"
    purpose: "Store all agent events for ADW swimlanes"
    key_columns:
      - "id (UUID)"
      - "agent_id (UUID)"
      - "adw_id (UUID nullable)"
      - "adw_step (VARCHAR nullable)"
      - "event_category (VARCHAR)"
      - "event_type (VARCHAR)"
      - "summary (TEXT nullable)"
      - "payload (JSONB)"

execution_flow:
  trigger_to_completion:
    - "User: 'start adw: plan_build: Build a todo app'"
    - "start_adw: require_workflow, create ADW row, broadcast, start_workflow, record pid/log_path"
    - "Runner: uv run adws/adw_workflows/adw_plan_build.py --adw-id <id> (own process group, run.log)"
    - "run_workflow: load row, parse AdwInput, run STEPS; each step checks the ADW budget first"
    - "plan: /plan, agent calls submit_plan -> output_data.plan_path"
    - "build: /build '<plan_path>'"
    - "Outcome: status completed/failed + output_data; summaries drained; logging closed"
    - "Frontend: Receive events via WebSocket, update swimlane UI"

best_practices:
  - "Hand off results through submit tools, never by parsing text or picking the newest file"
  - "Fail closed: a review passes only through submit_review with verdict PASS and zero blockers"
  - "Give every step caps; keep review read-only"
  - "Quote slash-command arguments with slash_command()"
  - "Logging/DB failures inside a step are logged and ignored; workflow-level errors mark the row failed"
  - "Store all inputs in input_data JSONB for workflow recovery"

testing:
  offline: "cd adws && uv run --no-project --with pytest --with pytest-asyncio --with pydantic==2.12.3 --with claude-agent-sdk==0.2.163 --with asyncpg==0.30.0 --with python-dotenv==1.2.1 --with rich==14.2.0 --with websockets==15.0.1 pytest -q adw_tests"
  offline_fakes: "adw_tests/fakes.py: ReplayClient replays recorded SDK streams (MCP calls via the SDK bridge); MemorySink records DB writes"
  live_sdk_checks: "uv run adws/adw_tests/live/adw_agent_sdk.py <test-type> (needs a key)"
  manual_trigger: "uv run adws/adw_triggers/adw_manual_trigger.py feature-name plan_build_review 'Build a markdown preview app' /path/to/project"
  check_status:
    via_tool: "check_adw(adw_id='...')"
    via_ui: "ADW swimlanes panel shows real-time status"

key_file_locations:
  core_modules:
    adw_steps: "adws/adw_modules/adw_steps.py"
    adw_agent_sdk: "adws/adw_modules/adw_agent_sdk.py"
    adw_plan: "adws/adw_modules/adw_plan.py"
    adw_review: "adws/adw_modules/adw_review.py"
    adw_logging: "adws/adw_modules/adw_logging.py"
    adw_websockets: "adws/adw_modules/adw_websockets.py"
    adw_summarizer: "adws/adw_modules/adw_summarizer.py"
    adw_database: "adws/adw_modules/adw_database.py"

  workflows:
    plan_build: "adws/adw_workflows/adw_plan_build.py"
    plan_build_review: "adws/adw_workflows/adw_plan_build_review.py"
    plan_build_review_fix: "adws/adw_workflows/adw_plan_build_review_fix.py"

  triggers:
    scripts: "adws/adw_triggers/adw_scripts.py"
    manual: "adws/adw_triggers/adw_manual_trigger.py"

  orchestrator:
    agent_manager: "apps/orchestrator_3_stream/backend/modules/agent_manager.py (start_adw, check_adw, cancel_adw)"
    adw_bridge: "apps/orchestrator_3_stream/backend/modules/adw_bridge.py"
    database: "apps/orchestrator_3_stream/backend/modules/database.py (create_adw ... get_adw_system_logs)"
    websocket_manager: "apps/orchestrator_3_stream/backend/modules/websocket_manager.py (ADW broadcasts: 232-274)"

  frontend:
    swimlanes: "apps/orchestrator_3_stream/frontend/src/components/AdwSwimlanes.vue"
    service: "apps/orchestrator_3_stream/frontend/src/services/adwService.ts"
    store: "apps/orchestrator_3_stream/frontend/src/stores/orchestratorStore.ts"
    types: "apps/orchestrator_3_stream/frontend/src/types.d.ts (ADW types: 405-452)"

  slash_commands:
    plan: ".claude/commands/plan.md"
    build: ".claude/commands/build.md"
    review: ".claude/commands/review.md"
    fix: ".claude/commands/fix.md"

architecture_summary: |
  AI Developer Workflows represent the fusion of deterministic software engineering
  with non-deterministic AI intelligence. The orchestration layer (Python code)
  handles predictable tasks: spawning processes, managing state, logging events,
  broadcasting updates. The execution layer (Claude agents) handles creative tasks:
  reasoning about implementation, writing code, reviewing quality, fixing issues.

  This hybrid architecture outperforms both raw agents (which lose context and
  hallucinate state over multi-step tasks) and raw code (which can't adapt to
  novel problems). The pattern is infinitely composable - create new workflows
  by mixing and matching step types.

  Real-time visibility comes from the swimlane UI, where each ADW displays as
  a card with step lanes and event squares. Every tool call, thinking block,
  and response is visualized with AI-generated summaries on hover.
