[project]
name = "orchestrator_3_stream_backend"
version = "1.0.0"
description = "Orchestrator 3 Stream - PostgreSQL-backed multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-multipart",
    "asyncpg",
    "claude-agent-sdk",
    "rich",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
# httpx: fastapi.testclient needs it (tests/test_request_guards.py)
dev = ["pytest", "pytest-asyncio", "httpx"]
