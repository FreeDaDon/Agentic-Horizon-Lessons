prompt: >-
  Add a --json flag to the wordcount.py CLI. With --json it prints one JSON object with the
  integer keys "lines", "words" and "chars" instead of the plain text line. Without the flag
  the output must stay exactly as it is today.
grader: ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--noconftest", "test_hidden_wordcount.py"]
timeout_s: 300
max_turns: 10
max_budget_usd: 0.5
